<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Étiquette Vin</title>
<style>
/* Une colonne, formulaire puis résultat ; teintes lie-de-vin */
:root{
  --bg:#f7f4f4; --surface:#ffffff; --fg:#231a1d; --muted:#6e6266;
  --line:#e2d9db; --accent:#7a1f35; --accent-fg:#ffffff; --warn-bg:#fff4e0; --warn-fg:#7a4b00;
  --err:#b3261e;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171214; --surface:#221b1e; --fg:#f1e9eb; --muted:#a8999e; --line:#3a2f33;
    --accent:#d9708a; --accent-fg:#1a0f12; --warn-bg:#3a2c12; --warn-fg:#ffd28a; --err:#ff8a80; color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
input[type=password],input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.seg{flex:1 1 30%;position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.95rem}
.seg input:checked + span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;position:relative;text-align:center;font-weight:600;color:var(--muted)}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo small{font-weight:400}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
button{font:inherit;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--err)}
dl{margin:0;display:grid;gap:12px}
dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dd{margin:2px 0 0;font-size:1.05rem;font-weight:600}
.confirm{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 12px}
.confirm ul{margin:4px 0 0;padding-left:20px}
details{font-size:.8rem}
pre{font-family:var(--mono);white-space:pre-wrap;word-break:break-word;overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <header>
    <h1>Test Étiquette Vin</h1>
    <p class="sub">Test de faisabilité : la page appelle l’API du fournisseur directement depuis ce navigateur. Aucun serveur intermédiaire.</p>
  </header>

  <form class="card" id="form">
    <div>
      <label>Fournisseur</label>
      <div class="row" role="radiogroup">
        <label class="seg"><input type="radio" name="prov" id="p-gemini" value="gemini" checked><span>Gemini</span></label>
        <label class="seg"><input type="radio" name="prov" id="p-claude" value="claude"><span>Claude</span></label>
        <label class="seg"><input type="radio" name="prov" id="p-openai" value="openai"><span>ChatGPT</span></label>
      </div>
    </div>
    <div>
      <label for="key">Clé API</label>
      <input type="password" id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Collez votre clé ici">
      <div class="check" style="margin-top:8px"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:400">Mémoriser la clé sur cet appareil</label></div>
    </div>
    <div>
      <label for="model">Modèle</label>
      <input type="text" id="model" autocapitalize="off" spellcheck="false">
    </div>
    <div class="photos">
      <label class="photo" id="lab-front"><input type="file" id="front" accept="image/*" capture="environment">Photo face<small>étiquette avant</small></label>
      <label class="photo" id="lab-back"><input type="file" id="back" accept="image/*" capture="environment">Photo dos<small>contre-étiquette</small></label>
    </div>
    <button type="submit" id="go">Analyser</button>
    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <section class="card" id="result" hidden>
    <dl>
      <div><dt>Région</dt><dd id="r-region">—</dd></div>
      <div><dt>Vin</dt><dd id="r-vin">—</dd></div>
      <div><dt>Fenêtre</dt><dd id="r-fenetre">—</dd></div>
    </dl>
    <div class="confirm" id="r-confirm-box"><strong>À confirmer</strong><ul id="r-confirm"></ul></div>
    <details><summary>Réponse brute et diagnostic</summary><pre id="raw"></pre></details>
  </section>
</main>

<script>
const MODELS = { gemini: "gemini-2.5-flash", claude: "claude-sonnet-5-5", openai: "gpt-5-mini" };
const PROMPT = `Tu reçois deux photos d'une bouteille de vin : l'étiquette de face et la contre-étiquette au dos.
Réponds UNIQUEMENT avec un objet JSON, sans texte autour, de la forme :
{"region": "...", "vin": "...", "fenetre": "...", "a_confirmer": ["...", "..."]}
- region : région et appellation viticoles (ex. "Bordeaux – Pauillac AOC").
- vin : domaine/château, nom de la cuvée, couleur, millésime.
- fenetre : fenêtre de dégustation conseillée, en années (ex. "2026–2034"), avec une courte justification.
- a_confirmer : tout ce qui est illisible, absent des photos ou déduit plutôt que lu.
Réponds en français.`;

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const prov = () => document.querySelector('input[name=prov]:checked').value;

function loadProv(){
  const p = prov();
  $('model').value = store.get('model-'+p) || MODELS[p];
  const k = store.get('key-'+p);
  $('key').value = k || '';
  $('remember').checked = !!k;
}
document.querySelectorAll('input[name=prov]').forEach(r => r.addEventListener('change', loadProv));
loadProv();

// Réduit la photo (bord long 1600 px, JPEG) pour alléger l'envoi
const images = {};
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => rej(new Error("Image illisible"));
    img.src = url;
  });
}
['front','back'].forEach(side => {
  $(side).addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    const data = await shrink(f);
    images[side] = data.split(',')[1];
    const lab = $('lab-'+side);
    let im = lab.querySelector('img'); if(!im){ im = document.createElement('img'); lab.appendChild(im); }
    im.src = data; im.alt = side === 'front' ? 'Photo face' : 'Photo dos';
  });
});

async function callGemini(key, model, imgs){
  const parts = [{text: PROMPT}, ...imgs.map(b => ({inline_data:{mime_type:'image/jpeg', data:b}}))];
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:'POST', headers:{'content-type':'application/json','x-goog-api-key':key},
    body: JSON.stringify({contents:[{parts}], generationConfig:{responseMimeType:'application/json'}})
  });
  const j = await r.json();
  return {status:r.status, json:j, text: j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || ''};
}
async function callClaude(key, model, imgs){
  const content = [...imgs.map(b => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data:b}})), {type:'text', text: PROMPT}];
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model, max_tokens:1024, messages:[{role:'user', content}]})
  });
  const j = await r.json();
  return {status:r.status, json:j, text: (j?.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')};
}
async function callOpenAI(key, model, imgs){
  const content = [{type:'text', text: PROMPT}, ...imgs.map(b => ({type:'image_url', image_url:{url:'data:image/jpeg;base64,'+b}}))];
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'content-type':'application/json','authorization':'Bearer '+key},
    body: JSON.stringify({model, messages:[{role:'user', content}], response_format:{type:'json_object'}})
  });
  const j = await r.json();
  return {status:r.status, json:j, text: j?.choices?.[0]?.message?.content || ''};
}

function parseJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const m = t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
function setStatus(msg, err){ $('status').textContent = msg; $('status').className = 'status' + (err?' err':''); }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const p = prov(), key = $('key').value.trim(), model = $('model').value.trim() || MODELS[p];
  if(!key) return setStatus("Collez d’abord une clé API.", true);
  const imgs = [images.front, images.back].filter(Boolean);
  if(!imgs.length) return setStatus("Prenez au moins une photo (face ou dos).", true);
  if($('remember').checked){ store.set('key-'+p, key); } else { store.del('key-'+p); }
  store.set('model-'+p, model);

  $('go').disabled = true; setStatus('Analyse en cours…');
  const t0 = performance.now();
  let out;
  try{
    out = await ({gemini:callGemini, claude:callClaude, openai:callOpenAI})[p](key, model, imgs);
  }catch(err){
    $('go').disabled = false;
    return setStatus(`Appel bloqué avant réponse (${err.message}). Cause probable : CORS ou réseau.`, true);
  }
  $('go').disabled = false;
  const ms = Math.round(performance.now()-t0);
  const diag = `Fournisseur : ${p}\nModèle : ${model}\nOrigine : ${location.origin}\nHTTP ${out.status} en ${ms} ms\n\n`;
  $('raw').textContent = diag + JSON.stringify(out.json, null, 2);
  $('result').hidden = false;
  if(out.status !== 200){
    const msg = out.json?.error?.message || JSON.stringify(out.json).slice(0,200);
    ['r-region','r-vin','r-fenetre'].forEach(id => $(id).textContent = '—');
    $('r-confirm').innerHTML = '';
    return setStatus(`L’appel direct fonctionne, mais l’API a refusé la requête (HTTP ${out.status}) : ${msg}`, true);
  }
  const d = parseJSON(out.text) || {};
  $('r-region').textContent = d.region || '—';
  $('r-vin').textContent = d.vin || '—';
  $('r-fenetre').textContent = d.fenetre || '—';
  const ul = $('r-confirm'); ul.innerHTML = '';
  (Array.isArray(d.a_confirmer) ? d.a_confirmer : (d.a_confirmer ? [d.a_confirmer] : [])).forEach(x => {
    const li = document.createElement('li'); li.textContent = x; ul.appendChild(li);
  });
  if(!ul.children.length){ const li = document.createElement('li'); li.textContent = 'Rien de signalé.'; ul.appendChild(li); }
  setStatus(`Analyse terminée en ${(ms/1000).toFixed(1)} s (HTTP 200).`);
  $('result').scrollIntoView({behavior:'smooth', block:'start'});
});
</script>
</body>
</html>
