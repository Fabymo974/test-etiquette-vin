<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Étiquette Vin</title>
<style>
/* Une colonne : onglets, analyse ou cave, puis fiche ; teintes lie-de-vin */
:root{
  --bg:#f7f4f4; --surface:#ffffff; --fg:#231a1d; --muted:#6e6266;
  --line:#e2d9db; --accent:#7a1f35; --accent-fg:#ffffff; --warn-bg:#fff4e0; --warn-fg:#7a4b00;
  --err:#b3261e; --ok:#1f6b3a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171214; --surface:#221b1e; --fg:#f1e9eb; --muted:#a8999e; --line:#3a2f33;
    --accent:#d9708a; --accent-fg:#1a0f12; --warn-bg:#3a2c12; --warn-fg:#ffd28a; --err:#ff8a80; --ok:#7fd69b; color-scheme: dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.tabs{display:flex;gap:6px}
.tab{flex:1;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted)}
input[type=password],input[type=text],input[type=date],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:46px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap}
.seg{flex:1 1 28%;position:relative;margin:0}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.95rem}
.seg input:checked + span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg small{font-weight:400;opacity:.8}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1 / -1}
.fields > div{min-width:0}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;position:relative;text-align:center;font-weight:600;color:var(--muted);margin:0}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo small{font-weight:400}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:8px}
button{font:inherit;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.ghost{background:transparent;color:var(--err);border:1px solid var(--line);font-weight:600}
button.back{background:transparent;color:var(--accent);padding:0;align-self:flex-start;font-weight:600}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--err)}
.status.ok{color:var(--ok)}
.confirm{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 12px}
.confirm ul{margin:4px 0 0;padding-left:20px}
details{font-size:.8rem}
pre{font-family:var(--mono);white-space:pre-wrap;word-break:break-word;overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px;font-weight:400}
.item img,.item .ph{width:52px;height:68px;border-radius:6px;object-fit:cover;flex:none;background:var(--bg)}
.item .txt{min-width:0;flex:1}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:.85rem;color:var(--muted)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:.75rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.badge.s{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>
<body>
<main>
  <header>
    <h1>Test Étiquette Vin</h1>
    <p class="sub">L’analyse appelle l’IA directement depuis ce téléphone. Les bouteilles sont enregistrées sur ce téléphone uniquement.</p>
  </header>

  <nav class="tabs">
    <button type="button" class="tab on" id="t-scan">Analyser</button>
    <button type="button" class="tab" id="t-cave">Ma cave <span id="count"></span></button>
  </nav>

  <!-- Analyse -->
  <form class="card" id="scan">
    <div>
      <label>Fournisseur</label>
      <div class="row" role="radiogroup">
        <label class="seg"><input type="radio" name="prov" id="p-gemini" value="gemini" checked><span>Gemini</span></label>
        <label class="seg"><input type="radio" name="prov" id="p-claude" value="claude"><span>Claude</span></label>
        <label class="seg"><input type="radio" name="prov" id="p-openai" value="openai"><span>ChatGPT</span></label>
      </div>
    </div>
    <div>
      <label for="key">Clé API</label>
      <input type="password" id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Collez votre clé ici">
      <div class="check"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:400">Mémoriser la clé sur cet appareil</label></div>
    </div>
    <div>
      <label for="model">Modèle</label>
      <input type="text" id="model" autocapitalize="off" spellcheck="false">
    </div>
    <div class="photos">
      <label class="photo" id="lab-front"><input type="file" id="front" accept="image/*" capture="environment">Photo face<small>étiquette avant</small></label>
      <label class="photo" id="lab-back"><input type="file" id="back" accept="image/*" capture="environment">Photo dos<small>contre-étiquette</small></label>
    </div>
    <button type="submit" id="go">Analyser</button>
    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <!-- Ma cave -->
  <section id="cave" hidden>
    <div class="list" id="list"></div>
    <p class="empty" id="empty">Aucune bouteille pour l’instant. Analysez une étiquette puis appuyez sur « Sauver ».</p>
  </section>

  <!-- Fiche bouteille -->
  <form class="card" id="fiche" hidden>
    <button type="button" class="back" id="back-cave" hidden>← Ma cave</button>
    <h2 id="fiche-title">Fiche bouteille</h2>
    <div class="fields">
      <div class="full">
        <label for="f-region">Région</label>
        <select id="f-region"></select>
      </div>
      <div class="full"><label for="f-appellation">Appellation</label><input type="text" id="f-appellation"></div>
      <div class="full"><label for="f-vin">Vin <span class="hint">domaine, cuvée</span></label><input type="text" id="f-vin"></div>
      <div><label for="f-millesime">Millésime</label><input type="text" id="f-millesime" inputmode="numeric"></div>
      <div><label for="f-fenetre">Fenêtre</label><input type="text" id="f-fenetre" placeholder="2026–2030"></div>
    </div>

    <div>
      <label>Couleur <span class="hint" id="c-hint"></span></label>
      <div class="row" role="radiogroup">
        <label class="seg"><input type="radio" name="couleur" id="c-rouge" value="rouge"><span>Rouge</span></label>
        <label class="seg"><input type="radio" name="couleur" id="c-rose" value="rosé"><span>Rosé</span></label>
        <label class="seg"><input type="radio" name="couleur" id="c-blanc" value="blanc"><span>Blanc</span></label>
      </div>
    </div>

    <div>
      <label>Stock</label>
      <div class="row" role="radiogroup">
        <label class="seg"><input type="radio" name="stock" id="s-s" value="S"><span>S <small>· Stock</small></span></label>
        <label class="seg"><input type="radio" name="stock" id="s-v" value="V"><span>V <small>· Vide</small></span></label>
      </div>
    </div>

    <div>
      <label>Note</label>
      <div class="row" role="radiogroup">
        <label class="seg"><input type="radio" name="note" id="n-1" value="Mauvais"><span>Mauvais</span></label>
        <label class="seg"><input type="radio" name="note" id="n-2" value="Passable"><span>Passable</span></label>
        <label class="seg"><input type="radio" name="note" id="n-3" value="Excellent"><span>Excellent</span></label>
      </div>
    </div>
    <div>
      <label for="f-precision">Précision</label>
      <textarea id="f-precision" placeholder="Ce que vous en avez pensé, avec quoi vous l’avez bu…"></textarea>
    </div>

    <div class="fields">
      <div class="full"><label for="f-lieu">Lieu</label><input type="text" id="f-lieu" placeholder="Cave, salon, domaine…"></div>
      <div><label for="f-prix">Prix (€)</label><input type="text" id="f-prix" inputmode="decimal" placeholder="12,50"></div>
      <div><label for="f-date">Date</label><input type="date" id="f-date"></div>
    </div>

    <div class="confirm" id="confirm-box" hidden><strong>À confirmer</strong><ul id="confirm"></ul></div>
    <details id="diag" hidden><summary>Réponse brute et diagnostic</summary><pre id="raw"></pre></details>

    <button type="submit" id="save">Sauver</button>
    <div class="status" id="save-status" aria-live="polite"></div>
    <button type="button" class="ghost" id="del" hidden>Supprimer cette bouteille</button>
  </form>
</main>

<script>
const MODELS = { gemini: "gemini-3.8-flash", claude: "claude-sonnet-5-5", openai: "gpt-5-mini" };
const REGIONS = ['Alsace','Beaujolais','Bordeaux','Bourgogne','Champagne','Corse','Jura','Languedoc-Roussillon','Provence','Savoie','Sud-Ouest','Vallée de la Loire','Vallée du Rhône','Autre'];
const PROMPT = `Lis les photos d'une bouteille de vin (étiquette de face et contre-étiquette).
Réponds UNIQUEMENT avec ce JSON, sans texte autour :
{"region":"","appellation":"","vin":"","millesime":"","couleur":"","fenetre":"","a_confirmer":[]}
- region : EXACTEMENT un nom de cette liste, rien d'autre : ${REGIONS.join(', ')}. "Autre" pour un vin étranger.
- appellation : l'appellation seule (ex. "Cairanne", "Hautes-Côtes de Beaune").
- vin : domaine ou château, puis la cuvée s'il y en a une. Sans appellation, couleur ni année.
- millesime : l'année écrite sur l'étiquette, telle quelle. Ne la remets jamais en question.
- couleur : "rouge", "rosé" ou "blanc" seulement si c'est écrit sur l'étiquette. Sinon "".
- fenetre : années conseillées pour le boire, ex. "2026–2030". Rien d'autre.
- a_confirmer : 2 points au maximum, de moins de 8 mots chacun, seulement si la région, le vin ou l'année sont illisibles ou absents. Ne parle jamais de la couleur, de l'embouteillage, du lot ni du producteur. Le plus souvent : [].
Réponds en français.`;

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const radio = name => document.querySelector(`input[name=${name}]:checked`)?.value || '';
const setRadio = (name, v) => document.querySelectorAll(`input[name=${name}]`).forEach(r => r.checked = (r.value === v));
const prov = () => radio('prov');

/* ---------- Base de données sur le téléphone (IndexedDB) ---------- */
const db = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('cave', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('bouteilles', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('bouteilles', mode); const req = fn(t.objectStore('bouteilles'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return { all: () => tx('readonly', s => s.getAll()), get: id => tx('readonly', s => s.get(id)),
           put: o => tx('readwrite', s => s.put(o)), del: id => tx('readwrite', s => s.delete(id)) };
})();
try{ navigator.storage?.persist?.(); }catch(e){}

/* ---------- Région : toujours un nom de la liste ---------- */
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
const ALIAS = {rhone:'Vallée du Rhône', loire:'Vallée de la Loire', languedoc:'Languedoc-Roussillon', roussillon:'Languedoc-Roussillon', sudouest:'Sud-Ouest', bourgogne:'Bourgogne', bordeaux:'Bordeaux', beaujolais:'Beaujolais', champagne:'Champagne', alsace:'Alsace', provence:'Provence', savoie:'Savoie', jura:'Jura', corse:'Corse'};
function toRegion(s){
  const n = norm(s); if(!n) return '';
  const exact = REGIONS.find(r => norm(r) === n); if(exact) return exact;
  for (const k in ALIAS) if (n.includes(k)) return ALIAS[k];
  return 'Autre';
}
$('f-region').innerHTML = '<option value="">— à choisir</option>' + REGIONS.map(r => `<option>${r}</option>`).join('');

/* ---------- Réglages fournisseur ---------- */
function loadProv(){
  const p = prov();
  $('model').value = store.get('model-'+p) || MODELS[p];
  const k = store.get('key-'+p);
  $('key').value = k || '';
  $('remember').checked = !!k;
}
document.querySelectorAll('input[name=prov]').forEach(r => r.addEventListener('change', loadProv));
loadProv();

/* ---------- Photos (réduites avant envoi) ---------- */
const images = {}; let thumb = '';
function shrink(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error("Image illisible"));
    img.src = url;
  });
}
['front','back'].forEach(side => {
  $(side).addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    const data = await shrink(f, 1280, 0.8);
    images[side] = data.split(',')[1];
    if (side === 'front') thumb = await shrink(f, 240, 0.7);
    const lab = $('lab-'+side);
    let im = lab.querySelector('img'); if(!im){ im = document.createElement('img'); lab.appendChild(im); }
    im.src = data; im.alt = side === 'front' ? 'Photo face' : 'Photo dos';
  });
});

/* ---------- Appels aux fournisseurs ---------- */
async function callGemini(key, model, imgs){
  const parts = [{text: PROMPT}, ...imgs.map(b => ({inline_data:{mime_type:'image/jpeg', data:b}}))];
  const thinking = [{thinkingLevel:'minimal'}, {thinkingLevel:'low'}, {thinkingBudget:0}, null];
  let r, j;
  for (const t of thinking){
    const generationConfig = {responseMimeType:'application/json'};
    if (t) generationConfig.thinkingConfig = t;
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method:'POST', headers:{'content-type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({contents:[{parts}], generationConfig})
    });
    j = await r.json();
    if (!(r.status === 400 && /think/i.test(j?.error?.message || ''))) break;
  }
  return {status:r.status, json:j, text: j?.candidates?.[0]?.content?.parts?.map(p=>p.thought ? '' : (p.text||'')).join('') || ''};
}
async function callClaude(key, model, imgs){
  const content = [...imgs.map(b => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data:b}})), {type:'text', text: PROMPT}];
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model, max_tokens:1024, messages:[{role:'user', content}]})
  });
  const j = await r.json();
  return {status:r.status, json:j, text: (j?.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')};
}
async function callOpenAI(key, model, imgs){
  const content = [{type:'text', text: PROMPT}, ...imgs.map(b => ({type:'image_url', image_url:{url:'data:image/jpeg;base64,'+b}}))];
  let r, j;
  for (const effort of ['minimal', null]){
    const body = {model, messages:[{role:'user', content}], response_format:{type:'json_object'}};
    if (effort) body.reasoning_effort = effort;
    r = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{'content-type':'application/json','authorization':'Bearer '+key},
      body: JSON.stringify(body)
    });
    j = await r.json();
    if (!(r.status === 400 && /reasoning/i.test(j?.error?.message || ''))) break;
  }
  return {status:r.status, json:j, text: j?.choices?.[0]?.message?.content || ''};
}
function parseJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const m = String(t).match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
function setStatus(el, msg, kind){ $(el).textContent = msg; $(el).className = 'status' + (kind ? ' '+kind : ''); }

/* ---------- Fiche ---------- */
let current = null;   // bouteille ouverte (null = nouvelle)
const today = () => new Date().toISOString().slice(0,10);

function fillFiche(b){
  $('f-region').value = REGIONS.includes(b.region) ? b.region : '';
  $('f-appellation').value = b.appellation || '';
  $('f-vin').value = b.vin || '';
  $('f-millesime').value = b.millesime || '';
  $('f-fenetre').value = b.fenetre || '';
  setRadio('couleur', b.couleur || '');
  setRadio('stock', b.stock || 'S');
  setRadio('note', b.note || '');
  $('f-precision').value = b.precision || '';
  $('f-lieu').value = b.lieu || '';
  $('f-prix').value = b.prix || '';
  $('f-date').value = b.date || today();
  $('c-hint').textContent = '';
  $('confirm-box').hidden = true; $('diag').hidden = true;
  setStatus('save-status', '');
  $('del').textContent = 'Supprimer cette bouteille'; delete $('del').dataset.armed;
}
function readFiche(){
  return {
    region: $('f-region').value, appellation: $('f-appellation').value.trim(), vin: $('f-vin').value.trim(),
    millesime: $('f-millesime').value.trim(), fenetre: $('f-fenetre').value.trim(),
    couleur: radio('couleur'), stock: radio('stock') || 'S', note: radio('note'),
    precision: $('f-precision').value.trim(), lieu: $('f-lieu').value.trim(), prix: $('f-prix').value.trim(), date: $('f-date').value
  };
}

/* ---------- Vues ---------- */
function show(view){
  const cave = view === 'cave', fiche = view === 'fiche';
  $('t-scan').classList.toggle('on', view === 'scan' || view === 'new');
  $('t-cave').classList.toggle('on', cave || fiche);
  $('scan').hidden = !(view === 'scan' || view === 'new');
  $('cave').hidden = !cave;
  $('fiche').hidden = !(view === 'new' || fiche);
  $('back-cave').hidden = !fiche;
  $('del').hidden = !fiche;
  $('fiche-title').textContent = fiche ? 'Fiche bouteille' : 'Nouvelle bouteille';
  if (cave) renderCave();
}
$('t-scan').addEventListener('click', () => show(current === null && !$('fiche').hidden ? 'new' : 'scan'));
$('t-cave').addEventListener('click', () => show('cave'));
$('back-cave').addEventListener('click', () => show('cave'));

async function renderCave(){
  let all = [];
  try { all = await db.all(); } catch(e) { setStatus('save-status', 'Base de données indisponible sur ce navigateur.', 'err'); }
  all.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  $('count').textContent = all.length ? `(${all.length})` : '';
  const list = $('list'); list.innerHTML = '';
  $('empty').hidden = all.length > 0;
  for (const b of all){
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'item';
    const img = b.photo ? Object.assign(document.createElement('img'), {src:b.photo, alt:''}) : Object.assign(document.createElement('div'), {className:'ph'});
    const txt = document.createElement('div'); txt.className = 'txt';
    const t = document.createElement('b'); t.textContent = [b.vin || 'Sans nom', b.millesime].filter(Boolean).join(' – ');
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = [b.region, b.appellation].filter(Boolean).join(' · ');
    const bd = document.createElement('div'); bd.className = 'badges';
    const add = (s, cls) => { if(!s) return; const e = document.createElement('span'); e.className = 'badge ' + (cls||''); e.textContent = s; bd.appendChild(e); };
    add(b.stock || 'S', (b.stock || 'S') === 'S' ? 's' : ''); add(b.couleur); add(b.note);
    txt.append(t, m, bd); btn.append(img, txt);
    btn.addEventListener('click', () => { current = b; fillFiche(b); show('fiche'); window.scrollTo(0,0); });
    list.appendChild(btn);
  }
}

$('fiche').addEventListener('submit', async e => {
  e.preventDefault();
  const data = readFiche();
  const b = current ? {...current, ...data, updatedAt: Date.now()}
                    : {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), createdAt: Date.now(), photo: thumb, ...data};
  try {
    await db.put(b);
    current = b;
    setStatus('save-status', `Enregistré dans Ma cave (${b.stock}).`, 'ok');
    $('back-cave').hidden = false; $('del').hidden = false; $('fiche-title').textContent = 'Fiche bouteille';
    $('t-scan').classList.remove('on'); $('t-cave').classList.add('on'); $('scan').hidden = true;
    renderCave();
  } catch(err) {
    setStatus('save-status', 'Échec de l’enregistrement : ' + err.message, 'err');
  }
});
$('del').addEventListener('click', async () => {
  if (!current) return;
  if (!$('del').dataset.armed){ $('del').dataset.armed = '1'; $('del').textContent = 'Appuyez encore pour confirmer la suppression'; return; }
  await db.del(current.id); current = null; show('cave');
});

/* ---------- Analyse ---------- */
$('scan').addEventListener('submit', async e => {
  e.preventDefault();
  const p = prov(), key = $('key').value.trim(), model = $('model').value.trim() || MODELS[p];
  if(!key) return setStatus('status', "Collez d’abord une clé API.", 'err');
  const imgs = [images.front, images.back].filter(Boolean);
  if(!imgs.length) return setStatus('status', "Prenez au moins une photo (face ou dos).", 'err');
  if($('remember').checked){ store.set('key-'+p, key); } else { store.del('key-'+p); }
  store.set('model-'+p, model);

  $('go').disabled = true; setStatus('status', 'Analyse en cours…');
  const t0 = performance.now();
  let out;
  try{
    out = await ({gemini:callGemini, claude:callClaude, openai:callOpenAI})[p](key, model, imgs);
  }catch(err){
    $('go').disabled = false;
    return setStatus('status', `Appel bloqué avant réponse (${err.message}). Cause probable : CORS ou réseau.`, 'err');
  }
  $('go').disabled = false;
  const ms = Math.round(performance.now()-t0);
  const diag = `Fournisseur : ${p}\nModèle : ${model}\nHTTP ${out.status} en ${ms} ms\n\n`;
  if(out.status !== 200){
    const msg = out.json?.error?.message || JSON.stringify(out.json).slice(0,200);
    return setStatus('status', `L’API a refusé la requête (HTTP ${out.status}) : ${msg}`, 'err');
  }
  const d = parseJSON(out.text) || {};
  current = null;
  const c = String(d.couleur || '').toLowerCase().replace(/^rose$/, 'rosé');
  fillFiche({ region: toRegion(d.region), appellation: d.appellation, vin: d.vin, millesime: d.millesime,
              fenetre: d.fenetre, couleur: ['rouge','rosé','blanc'].includes(c) ? c : '', stock: 'S' });
  $('c-hint').textContent = ['rouge','rosé','blanc'].includes(c) ? '' : '· non indiquée sur l’étiquette, à choisir';
  const ul = $('confirm'); ul.innerHTML = '';
  (Array.isArray(d.a_confirmer) ? d.a_confirmer : (d.a_confirmer ? [d.a_confirmer] : [])).slice(0,2).forEach(x => {
    const li = document.createElement('li'); li.textContent = x; ul.appendChild(li);
  });
  $('confirm-box').hidden = !ul.children.length;
  $('raw').textContent = diag + JSON.stringify(out.json, null, 2); $('diag').hidden = false;
  setStatus('status', `Analyse terminée en ${(ms/1000).toFixed(1)} s. Complétez la fiche puis appuyez sur « Sauver ».`);
  show('new');
  $('fiche').scrollIntoView({behavior:'smooth', block:'start'});
});

renderCave();
</script>
</body>
</html>
